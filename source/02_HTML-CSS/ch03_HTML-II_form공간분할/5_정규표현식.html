<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <title></title>
  <style>
    p{text-align:center; /* 글씨, 이미지, input 등 가운데 정렬 */}
  </style>
</head>
<body>
  <form>
    <fieldset>
      <legend>필드 유효성 검사</legend>
      <ul>
        <li>
          <label for="tel">연락처</label>
          <input type="text" name="tel" id="tel"
                 placeholder="전화번호형식(첫화면 도움말)"
                 required="required"
                 autofocus="autofocus"
                 autocomplete="off" />
        </li>
        <li>
          <label for="email">이메일</label>
          <input type="text" name="email" id="email"
                 placeholder="아이디@도메인"
                 />
        </li>
      </ul>
      <p>
        <input type="submit" value="입력" />
        <input type="reset" />
      </p>
    </fieldset>
  </form>
</body>
</html>
