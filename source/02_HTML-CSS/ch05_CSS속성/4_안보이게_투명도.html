<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <title></title>
  <style>
    #visibility>div, #display>div{
      width:100px; height:100px; background-color:red;
    }
    /* 안보이게 */
  </style>
</head>
<body>
  <div id="visibility">
    <div>기본은불투명</div><div>안보이게(visibility)</div><div>거의 투명</div>
  </div>
  <div id="display">
    <div>반투명</div><div>안보이게(display)</div><div>불투명</div>
  </div>
</body>
</html>
