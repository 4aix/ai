<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <title></title>
  <style>
    table {
      width: 350px;
      margin: 20px auto;
      padding: 20px 10px;
    }
    table,
    input[type='text'],
    input[type='password'] {
      border: 1px solid #385d81;
      outline: 1px solid #385d81;
      padding: 2px;
    }
    input[type='submit'],
    input[type='reset'],
    input[type='button'],
    button {
      background-color: #385d81;
      border: 0;
      outline: 0;
      color: white;
      border-radius: 3px;
      padding: 10px 20px;
      margin: 5px;
    }
    td,
    th {
      padding: 5px 10px;
      text-align: center;
    }
  </style>
  <script>
    const joinCheck = () => {
      // 패턴들(숫자, 알파벳, 특수문자), 이메일정규표현식패턴, [이름정규표현식패턴]
      let patternNum = /[0-9]/; // 숫자 패턴
      let patternEng = /[a-zA-Z]/; // 알파벳 문자 패턴
      let patternSpe = /[~`!@#$%^&*()_\-+=\|\\\[\]{}'":;?\/<>,\.]/; // 특수문자 패턴
      let patternEmail = /^\w+@\w+(\.\w+){1,2}$/;
      let patternName = /^[가-힣a-zA-Z]{2,}$/; // 이름 패턴

      // 입력상자에서 입력받은 내용을 변수
      let name = frm.name.value.trim(); // html 3장 4_pw유효성검사.html
      let mail = frm.mail.value.trim();
      let pw = frm.pw.value.trim();
      let pwChk = frm.pwChk.value.trim();
      // 유효한 데이터를 입력하지 않을 경우 return false부분
      // 이름 유효성 체크 방법1
      /*if(!name.match(patternName)){
        alert('2자 이상의 이름형식이 입력되지 않았습니다');
        frm.name.focus();
        return false;
      }*/
      // 이름 유효성 체크 방법2
      if (name.length < 2) {
        alert('2자 이상의 이름은 필수 입력입니다');
        frm.name.focus();
        return false;
      } else if (patternSpe.test(name) || patternNum.test(name)) {
        alert('이름에 특수문자나 숫자가 포함될 수 없습니다.');
        frm.name.focus()
        return false;
      } else if (mail && !mail.match(patternEmail)) {
        // 메일을 입력하지 않거나, 입력한다면 메일 형식에 맞아야 함
        // 메일을 입력하고, 메일패턴이 일치지되지 않으면 if 조건 참
        alert('메일 형식을 확인하세요');
        frm.name.focus();
        return false;
      } else if (!pw) {
        alert('비밀번호는 필수 입력사항입니다');
        frm.pw.focus();
        return false;
      } else if (pw != pwChk) {
        alert('비밀번호가 일치하지 않습니다');
        frm.pw.value = '';
        frm.pwChk.value = '';
        frm.pw.focus();
        return false;
      } else if (!patternNum.test(pw) ||
        !patternEng.test(pw) ||
        !patternSpe.test(pw) ||
        pw.length < 4) {
        alert('비밀번호는 알파벳, 숫자, 특수문자를 포함한 4글자 이상입니다');
        frm.name.focus();
        return false;  
      }
    };
  </script>
</head>

<body>
  <form action="#" name="frm" onsubmit="return joinCheck()">
    <table>
      <tr>
        <th>이름</th>
        <td>
          <input type="text" name="name" placeholder="특수문자와 숫자 못 와" autofocus="autofocus" />
        </td>
      </tr>
      <tr>
        <th>메일</th>
        <td><input type="text" name="mail" placeholder="메일 형식에 맞추세요" /></td>
      </tr>
      <tr>
        <th>비밀번호</th>
        <td><input type="password" name="pw" placeholder="특수문자,알파벳,숫자 포함" /></td>
      </tr>
      <tr>
        <th>비밀번호</th>
        <td><input type="password" name="pwChk" /></td>
      </tr>
      <tr>
        <td colspan="2">
          <input type="submit" value="회원가입" />
          <input type="reset" value="취소" />
          <input type="button" value="로그인" />
        </td>
      </tr>
    </table>
  </form>
</body>

</html>
