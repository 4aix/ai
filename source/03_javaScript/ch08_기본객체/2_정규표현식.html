    <!--
    1. 참조 : https://ko.wikipedia.org/wiki/정규_표현식
    2. 간략문법
        \d : (숫자와 매치. [0-9]와 동일)
        \D : (숫자가 아닌 문자)
        \w : (영문자나 숫자. [a-zA-Z0-9]와 동일)
        \W : (영문자나 숫자가 아닌 문자)
        .  : (문자)
        \. : (.)
        \s : ( )
        {n,} : n회 반복
        {2,4} : 2~4회 반복
        ? : (0번이나 1번 의미)
        + : (1번 이상 반복)
        * : (0번 이상 반복)
        () : 블록잡을 때
    3. 정규표현식 연습장 : https://regexr.com/
      ex1. 전화번호 패턴 : (\d{2,3}[\-)]\d{3,4}-\d{4})|\d{9,11}
      ex2. 이메일 패턴 :   [a-z0-9_\.]{3,}@\w+\.\w+(\.\w+)?
                            \w[a-z0-9_]+@\w+(\.\w+){1,2}
      ex3. 생년월일 : \d{2}(0[1-9]|1[0-2])(0[1-9]|[1-2]\d|3[01])
            \d{2}((0[13-9]|1[0-2])(0[1-9]|[1-2]\d|3[01])|(020[1-9]|021\d|022[0-9]))
      ex4. 주민번호 : \d{2}(0[1-9]|1[0-2])(0[1-9]|[1-2]\d|3[01])-[1-4]\d{6}
    -->
