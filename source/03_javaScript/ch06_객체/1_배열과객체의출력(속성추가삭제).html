<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title></title>
  <script>
    var arr = [1, '홍길동'];  // arr = {'0':1, '1':'홍길동'} 처럼 인식. 배열에서는 key가 index
    for(let idx in arr){
      document.write(`${idx}번째(index타입:${typeof(idx)}) - ${arr[idx]}<br>`);
    }
    var obj = {'name':'홍길동', 'age':20}; // 객체에서는 key가 속성변수
    obj['name'], obj['age']
  </script>
</head>
<body>
</body>
</html>
