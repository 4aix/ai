<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="css/join.css" rel="stylesheet">
	<!-- '#id'의 keyup 이벤트에 ajax 구현 -->
	<!-- '#pw, #pwChk의 keyup 이벤트에 두 비밀번호 체크 -->
	<!-- 'form'의 submit 이벤트에 유효성 검사(#idConfirmResult, #pwChkResult) -->
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
			//----------------------------------------------------------------------
			// 1. 아이디 중복 체크(keyup이벤트 + fetch함수) : 2_fetch(keyup).html 참조
			//----------------------------------------------------------------------
			var idInput = document.querySelector('input[name="id"]');
			var idConfirmResult = document.getElementById('idConfirmResult');
			idInput.addEventListener('keyup', function(){ 
				var id = this.value;
				if(id.length<3){
					// 2글자 미만이면 굳이 서버에 요청 보낼 필요 없음
					idConfirmResult.textContent = '아이디는 2글자 이상';
					return;
				}
				let params = new URLSearchParams({id:id});
				fetch(`midConfirmNonExists.html?${params}`, {method:'get'})
				.then(response => {
					if(!response.ok){
            throw new Error(`${response.status} / ${response.statusText}`)
          }
          return response.text();
				})
				.then(data => idConfirmResult.innerHTML = data)
				.catch(error => alert(error.message));
			});
			//----------------------------------------------------------------------
			// 2. 두 비밀번호 일치 확인 (keyup이벤트) : 7_이벤트제한(표준이벤트).html 참조
			//----------------------------------------------------------------------
			var pwInput = document.getElementById('pw');
			var pwChkInput = document.getElementById('pwChk');
			var pwChkResult = document.getElementById('pwChkResult');
			function checkPasswordMatch(){
				var pw = pwInput.value;
				var pwChk = pwChkInput.value;
				if(!pw && !pwChk){
					pwChkResult.innerHTML = '비밀번호는 필수입력사항입니다';
				}else if (pw === pwChk) {
					pwChkResult.textContent = '비밀번호 일치합니다';
				}else {
					pwChkResult.textContent = '비밀번호 불일치합니다';
				}
			}
			pwInput.addEventListener('keyup', checkPasswordMatch);
			pwChkInput.addEventListener('keyup', checkPasswordMatch);
			//----------------------------------------------------------------------------
			// 3. 유효성 검사 (form의 submit 이벤트 제한) : 7_이벤트제한(표준이벤트).html 참조
			//   #idConfirmResult('사용 가능한 ID입니다')와 #pwChkResult(비밀번호 일치합니다)으로 유효성 검사
			//----------------------------------------------------------------------------
			var joinForm = document.querySelector('form');
			joinForm.addEventListener('submit', function(event){
				var idResultText = idConfirmResult.textContent.trim();
				var pwResultText = pwChkResult.textContent.trim();
				if (idResultText !== '사용 가능한 ID입니다') {
					alert('사용 가능한 ID인지 확인 요망');
					event.preventDefault(); // jQuery의 return false 대신 preventDefault() 사용
				} else if (pwResultText !== '비밀번호 일치합니다') {
					alert('비밀번호를 확인하세요');
					pwInput.focus();
					event.preventDefault();
				}
				// 두 조건 다 통과하면 그대로 submit 진행됨 (preventDefault 호출 안 함)
			});
		});
  </script>
</head>
<body>
	<div id="joinForm_wrap">
		<form>
			<div id="join_title">회원가입</div>
			<table>
				<tr>
					<th><label for="id">아이디</label></th>
					<td>
						<input type="text" name="id" id="id" class="id" required="required" autocomplete="off">
						<div id="idConfirmResult"> &nbsp; &nbsp; &nbsp; </div>
					</td>
				</tr>
				<tr>
					<th><label for="pw">비밀번호</label></th>
					<td><input type="password" name="pw" id="pw" class="pw"></td>
				</tr>
				<tr>
					<th><label for="pwChk">비밀번호확인</label></th>
					<td>
						<input type="password" name="pwChk" id="pwChk" class="pwChk">
						<div id="pwChkResult"> &nbsp; &nbsp; &nbsp; </div>
					</td>
				</tr>
				<tr>
					<th><label for="name">이름</label></th>
					<td><input type="text" name="name" id="name" class="name" required="required"></td>
				</tr>
				<tr>
					<th>생년월일</th>
					<td><input type="date" name="birth" id="datepicker" class="birth" autocomplete="off" ></td>
				</tr>
				<tr>
					<td colspan="2">
						<input type="submit" value="가입하기" class="joinBtn_style">
						<input type="reset" value="다시하기" class="joinBtn_style">
						<input type="button" value="로그인" class="joinBtn_style">
					</td>
				</tr>
			</table>
		</form>
	</div>
</body>
</html>
