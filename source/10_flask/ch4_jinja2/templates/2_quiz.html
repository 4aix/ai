{% extends "base.html" %}
{% block title %}구구단을 외자{% endblock %}
{% block content %}
  <div class="p-5 mb-4 bg-body-tertiary rounded-3">
    <h1 class="container-fluid py-5">
      구구단을 외자
    </h1>
    <form action="{{url_for('index')}}" method="post">
      <input type="number" 
              name="no" 
              placeholder="원하는 구구단 수를 입력">
      <input type="submit" value="이름추가" class="btn btn-outline-primary">
    </form>
  </div>
{% endblock %}
